# One GHCR tag per git tag: ghcr.io/<owner>/<image>:<git-tag>
# No branch, sha, latest, or semver-alias tags. PRs build without push.
name: Docker GHCR

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: local
            name: local (agent server)
            image: vibe-kanban
            dockerfile: ./Dockerfile
            build-args: |
              POSTHOG_API_KEY=
              POSTHOG_API_ENDPOINT=
              SENTRY_DSN=
          - id: cloud
            name: cloud (projects + kanban API)
            image: vibe-kanban-cloud
            dockerfile: ./crates/remote/Dockerfile
            build-args: |
              FEATURES=
              POSTHOG_API_KEY=
              POSTHOG_API_ENDPOINT=
              SENTRY_DSN_REMOTE=
              VITE_RELAY_API_BASE_URL=http://localhost:8082
              VITE_PUBLIC_REACT_VIRTUOSO_LICENSE_KEY=
    steps:
      - uses: actions/checkout@v6

      - name: Require version tag for publish
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "GHCR publish only runs on git tags matching v*." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+-[0-9]{14}$ ]]; then
            echo "Tag must match v<semver>-fork.<N>-<UTC timestamp>, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          build-args: ${{ matrix.build-args }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Build Docker image (PR validation only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build-args }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

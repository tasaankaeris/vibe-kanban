# Publishes to GHCR only on version git tags (v*). PRs build without push to avoid
# storage charges from branch/SHA images. After Create pre-release tag, use
# publish_existing or rely on gh workflow run docker-ghcr.yml --ref <tag>.
name: Docker GHCR

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: local
            name: local (agent server)
            image: vibe-kanban
            dockerfile: ./Dockerfile
            build-args: |
              POSTHOG_API_KEY=
              POSTHOG_API_ENDPOINT=
              SENTRY_DSN=
          - id: cloud
            name: cloud (projects + kanban API)
            image: vibe-kanban-cloud
            dockerfile: ./crates/remote/Dockerfile
            build-args: |
              FEATURES=
              POSTHOG_API_KEY=
              POSTHOG_API_ENDPOINT=
              SENTRY_DSN_REMOTE=
              VITE_RELAY_API_BASE_URL=http://localhost:8082
              VITE_PUBLIC_REACT_VIRTUOSO_LICENSE_KEY=
    steps:
      - uses: actions/checkout@v6

      - name: Require version tag for publish
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "GHCR publish only runs on git tags matching v* (e.g. v0.1.43-fork.1-20260528180301)." >&2
            echo "Create a tag via Create pre-release tag, or run this workflow with --ref <tag>." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Build Docker image (PR validation only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

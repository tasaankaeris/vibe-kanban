# Fork pre-releases — see docs/fork-release-pipeline.md
#
# GITHUB_TOKEN tag pushes do not start other workflows; this workflow explicitly runs
# Docker GHCR and Pre-release on tag at the tag ref after pushing the tag.
name: Create pre-release tag

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'tag_only | fork_patch | publish_existing (Docker + GH release only)'
        required: true
        default: tag_only
        type: choice
        options:
          - tag_only
          - fork_patch
          - publish_existing
      existing_tag:
        description: 'Required for publish_existing (e.g. v0.1.43-fork.1-20260528161343)'
        required: false
        type: string

concurrency:
  group: pre-release-tag-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  FORK_TAG_RE: '^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+-[0-9]{14}$'

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        if: inputs.action != 'publish_existing'
        with:
          fetch-depth: 0

      - name: Setup Node
        if: inputs.action != 'publish_existing'
        uses: ./.github/actions/setup-node

      - name: Install cargo-edit
        if: inputs.action == 'fork_patch'
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-edit
          git: https://github.com/killercup/cargo-edit
          rev: 96a3879fe3bafda6d0f943b642997fbf03e235cd # v0.13.9

      - name: Read fork version metadata
        if: inputs.action != 'publish_existing'
        id: fork
        run: |
          set -euo pipefail
          upstream_base=$(node -p "require('./fork-version.json').upstreamBase")
          fork_preid=$(node -p "require('./fork-version.json').forkPreid")
          current=$(node -p "require('./package.json').version")
          echo "upstream_base=$upstream_base" >> "$GITHUB_OUTPUT"
          echo "fork_preid=$fork_preid" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Upstream base: $upstream_base (not our release version)"
          echo "Current fork version: $current"

      - name: Determine version and tag name
        if: inputs.action != 'publish_existing'
        id: version
        env:
          UPSTREAM_BASE: ${{ steps.fork.outputs.upstream_base }}
          FORK_PREID: ${{ steps.fork.outputs.fork_preid }}
          CURRENT: ${{ steps.fork.outputs.current }}
        run: |
          set -euo pipefail
          timestamp=$(date -u +%Y%m%d%H%M%S)
          upstream_base="${{ steps.fork.outputs.upstream_base }}"
          fork_preid="${{ steps.fork.outputs.fork_preid }}"
          action="${{ inputs.action }}"

          if [[ "$action" == "fork_patch" ]]; then
            node -e "
              const upstream = process.env.UPSTREAM_BASE;
              const preid = process.env.FORK_PREID;
              const current = process.env.CURRENT;
              const forkPrefix = upstream + '-' + preid + '.';
              if (current !== upstream && !current.startsWith(forkPrefix)) {
                console.error('package.json version ' + current + ' is not on fork line ' + upstream + '-' + preid + '.N');
                process.exit(1);
              }
            "
            npm version prerelease --preid="$fork_preid" --no-git-tag-version
          fi

          new_version=$(node -p "require('./package.json').version")
          if [[ "$new_version" == "$upstream_base" ]]; then
            echo "Refusing to tag bare upstream version $upstream_base; run fork_patch or set ${upstream_base}-${fork_preid}.N in package.json"
            exit 1
          fi

          new_tag="v${new_version}-${timestamp}"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $new_tag (fork patch on upstream $upstream_base)"

      - name: Bump workspace versions
        if: inputs.action == 'fork_patch'
        run: |
          new_version="${{ steps.version.outputs.new_version }}"
          (
            cd npx-cli
            npm version "$new_version" --no-git-tag-version --allow-same-version
          )
          (
            cd packages/local-web
            npm version "$new_version" --no-git-tag-version --allow-same-version
          )
          cargo set-version --workspace "$new_version"
          node -e "
            const fs = require('fs');
            const path = 'crates/tauri-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$new_version';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Commit, tag, and push
        if: inputs.action != 'publish_existing'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          new_tag="${{ steps.version.outputs.new_tag }}"
          branch="${GITHUB_REF_NAME}"

          if [[ "${{ inputs.action }}" == "tag_only" ]]; then
            git tag -a "$new_tag" -m "Fork pre-release $new_tag"
            git push origin "refs/tags/${new_tag}"
          else
            git pull --rebase origin "$branch"
            git add package.json pnpm-lock.yaml npx-cli/package.json packages/local-web/package.json
            git add crates/tauri-app/tauri.conf.json Cargo.lock fork-version.json
            git add $(find . -name Cargo.toml)
            git commit -m "chore: bump fork version to ${{ steps.version.outputs.new_version }}"
            git tag -a "$new_tag" -m "Fork pre-release $new_tag"
            git push origin "HEAD:${branch}"
            git push origin "refs/tags/${new_tag}"
          fi

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${{ inputs.action }}" == "publish_existing" ]]; then
            tag="${{ inputs.existing_tag }}"
            if [[ -z "$tag" ]]; then
              echo "existing_tag is required when action is publish_existing" >&2
              exit 1
            fi
          else
            tag="${{ steps.version.outputs.new_tag }}"
          fi
          if [[ ! "$tag" =~ ${{ env.FORK_TAG_RE }} ]]; then
            echo "Tag must match v<semver>-fork.<N>-<UTC timestamp>, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Trigger Docker GHCR and GitHub pre-release
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          echo "Starting Docker GHCR for $tag"
          gh workflow run docker-ghcr.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Starting Pre-release on tag for $tag"
          gh workflow run release-on-tag.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f "tag=$tag"

      - name: Verify Docker GHCR publish
        id: verify-docker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          expected_local="ghcr.io/${{ github.repository_owner }}/vibe-kanban:${tag}"
          expected_cloud="ghcr.io/${{ github.repository_owner }}/vibe-kanban-cloud:${tag}"

          echo "Waiting for Docker GHCR run for tag ${tag}..."
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker-ghcr.yml \
              --json databaseId,headBranch,status,conclusion \
              --jq "map(select(.headBranch==\"${tag}\")) | .[0].databaseId // empty")
            if [[ -n "$run_id" ]]; then
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
              if [[ "$status" == "completed" ]]; then
                break
              fi
            fi
            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            echo "No Docker GHCR run found for tag ${tag}" >&2
            exit 1
          fi

          conclusion=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          if [[ "$conclusion" != "success" ]]; then
            echo "Docker GHCR run ${run_id} failed: ${conclusion}" >&2
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
            exit 1
          fi

          log=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log)
          if grep -q 'metadata-action' <<< "$log"; then
            echo "Docker GHCR must not use docker/metadata-action (tag ${tag} points at old workflow commit?)" >&2
            exit 1
          fi
          if grep -qE ':latest($|")' <<< "$log"; then
            echo "Docker GHCR must not push :latest" >&2
            exit 1
          fi
          if ! grep -qF "$expected_local" <<< "$log"; then
            echo "Expected local image tag in log: $expected_local" >&2
            exit 1
          fi
          if ! grep -qF "$expected_cloud" <<< "$log"; then
            echo "Expected cloud image tag in log: $expected_cloud" >&2
            exit 1
          fi

          echo "docker_ghcr_run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Verified Docker GHCR run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

      - name: Release summary
        run: |
          tag="${{ steps.release.outputs.tag }}"
          {
            echo "## Fork pre-release: \`${tag}\`"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Git tag | pushed |"
            echo "| Docker GHCR | [run](https://github.com/${{ github.repository }}/actions/runs/${{ steps.verify-docker.outputs.docker_ghcr_run_id }}) |"
            echo ""
            echo "### Deploy"
            echo "\`IMAGE_TAG=${tag}\` in \`deploy/.env\`, then:"
            echo "\`docker compose --env-file deploy/.env -f deploy/docker-compose.ghcr.yml pull\`"
          } >> "$GITHUB_STEP_SUMMARY"

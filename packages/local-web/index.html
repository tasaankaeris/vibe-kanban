<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-vk-light.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/favicon-vk-dark.svg" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
    <title>Vibe Kanban</title>
</head>

<body>
    <div id="root"></div>
    <script>
      // Polyfill crypto.randomUUID when native API is missing (e.g. HTTP via LAN IP).
      // Semantics match packages/web-core/src/shared/lib/uuid.ts uuidV4ForHttp().
      // Required because @tanstack/db calls crypto.randomUUID() directly.
      // See: https://github.com/TanStack/db/issues/784
      (function () {
        try {
          var cryptoObj = globalThis.crypto;
          if (!cryptoObj || typeof cryptoObj.randomUUID === 'function') {
            return;
          }
          cryptoObj.randomUUID = function () {
            var bytes = new Uint8Array(16);
            var c = globalThis.crypto;
            if (c && typeof c.getRandomValues === 'function') {
              c.getRandomValues(bytes);
            } else {
              for (var i = 0; i < 16; i++) {
                bytes[i] = Math.floor(Math.random() * 256);
              }
            }
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            var hex = [];
            for (var j = 0; j < 16; j++) {
              hex.push(bytes[j].toString(16).padStart(2, '0'));
            }
            return (
              hex[0] + hex[1] + hex[2] + hex[3] + '-' +
              hex[4] + hex[5] + '-' +
              hex[6] + hex[7] + '-' +
              hex[8] + hex[9] + '-' +
              hex[10] + hex[11] + hex[12] + hex[13] + hex[14] + hex[15]
            );
          };
        } catch (_) {
          // Polyfill must never break page load when crypto is unavailable.
        }
      })();
    </script>
    <script type="module" src="/src/app/entry/Bootstrap.tsx"></script>
</body>

</html>
